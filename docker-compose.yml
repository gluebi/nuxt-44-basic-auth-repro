services:
  nuxt:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - nuxt_node_modules:/app/node_modules
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm build && node .output/server/index.mjs"
    environment:
      NITRO_PORT: "3000"
      NITRO_HOST: "0.0.0.0"
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - nuxt

volumes:
  nuxt_node_modules:
